[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sceneify"
version = "0.1.0"
description = "Compose interactive 3D scenes from Python: multi-asset GLB/PLY, objects, annotations, and trajectories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Klajdi Beqiraj" },
]
keywords = [
  "3d",
  "glb",
  "gltf",
  "ply",
  "scene",
  "visualization",
  "three.js",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/KlajdiBeqiraj/sceneify"
Issues = "https://github.com/KlajdiBeqiraj/sceneify/issues"

[project.scripts]
sceneify = "sceneify.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/web",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py39"
