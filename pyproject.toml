[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sceneify"
version = "0.3.1"
description = "Compose interactive 3D worlds from Python: multi-asset scenes, environment rules, edit, and save/load."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Klajdi Beqiraj" },
]
keywords = [
  "3d",
  "glb",
  "gltf",
  "ply",
  "scene",
  "visualization",
  "three.js",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "httpx>=0.28",
]

[project.optional-dependencies]
mesh = [
  "trimesh>=4.6",
  "numpy>=2.2",
]

[project.urls]
Homepage = "https://github.com/KlajdiBeqiraj/sceneify"
Repository = "https://github.com/KlajdiBeqiraj/sceneify"
Issues = "https://github.com/KlajdiBeqiraj/sceneify/issues"
Documentation = "https://github.com/KlajdiBeqiraj/sceneify#readme"

[project.scripts]
sceneify = "sceneify.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.uv]
required-version = ">=0.11"
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/web",
  "/examples",
  "/docs",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q"]
