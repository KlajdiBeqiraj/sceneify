[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sceneify"
version = "0.0.2"
description = "Build interactive browser-based 3D worlds and games from Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Klajdi Beqiraj" },
]
keywords = [
  "3d",
  "glb",
  "gltf",
  "ply",
  "scene",
  "websocket",
  "visualization",
  "three.js",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "parso>=0.8.4",
]

[project.optional-dependencies]
llm = []
mcp = [
  "mcp>=2,<3",
]
mesh = [
  "trimesh>=4.6",
  "numpy>=2.2",
]
rl = []

[project.urls]
Homepage = "https://github.com/KlajdiBeqiraj/sceneify"
Repository = "https://github.com/KlajdiBeqiraj/sceneify"
Issues = "https://github.com/KlajdiBeqiraj/sceneify/issues"
Documentation = "https://github.com/KlajdiBeqiraj/sceneify#readme"

[project.scripts]
sceneify = "sceneify.cli:main"
sceneify-mcp = "sceneify.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.uv]
required-version = ">=0.11"
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/web",
  "/examples",
  "/docs",
  "/schemas",
  "/skills",
  "/tests",
  "/README.md",
  "/THIRD_PARTY_ASSETS.md",
  "/LICENSE",
]
exclude = [
  "/examples/assets/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sceneify"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "sceneify/schemas"
"skills" = "sceneify/skills"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q"]
