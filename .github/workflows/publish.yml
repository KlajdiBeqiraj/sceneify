name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip uploading to PyPI"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (tag or SHA)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build only; skip uploading to PyPI"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # github.event_name stays the caller's event (e.g. workflow_run),
          # never "workflow_call". Prefer inputs.ref when the reusable
          # workflow is invoked from release.yml.
          ref: ${{ inputs.ref || github.event.release.tag_name || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build viewer
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify release version
        if: github.event_name == 'release' || inputs.ref != ''
        env:
          RELEASE_TAG: ${{ inputs.ref || github.event.release.tag_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(
            python -c \
              "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          )"
          if [ "$actual" != "$expected" ]; then
            echo "pyproject.toml version ($actual) does not match release tag ($expected)" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: >-
      inputs.dry_run != true &&
      (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        inputs.ref != ''
      )
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sceneify
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
