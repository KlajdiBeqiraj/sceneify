name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag-release:
    name: Tag release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.prepare.outputs.skipped }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout main branch
        run: git checkout -B main origin/main

      - name: Prepare release
        id: prepare
        run: python3 scripts/prepare_release.py

      - name: Commit, tag, and publish GitHub Release
        if: steps.prepare.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
          NOTES_PATH: ${{ steps.prepare.outputs.notes_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioning.json pyproject.toml src/sceneify/__init__.py uv.lock
          git commit -m "chore(release): ${VERSION}"
          git push origin main
          gh release create "${TAG}" \
            --target main \
            --title "${VERSION}" \
            --notes-file "${NOTES_PATH}"

  # PyPI Trusted Publishing does not support reusable workflows
  # (workflow_ref would be release.yml, publisher is publish.yml).
  # GITHUB_TOKEN may dispatch workflow_dispatch, unlike release events.
  trigger-publish:
    name: Trigger PyPI publish
    needs: tag-release
    if: >-
      needs.tag-release.result == 'success' &&
      needs.tag-release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch publish.yml on the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            --ref "${TAG}"
